name: Native AMD64 sample
on:
  workflow_dispatch:
  push:
    branches: [benchmark-amd64]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and score three fresh containers
        run: |
          uname -m
          set -o pipefail
          make sample | tee /tmp/public-score
          grep -Eq '^Misses: +[1-9]' /tmp/public-score && exit 1
          make sample SAMPLE="$PWD/tools/regression" | tee /tmp/regression-score
          if grep -Eq '^Misses: +[1-9]' /tmp/regression-score; then exit 1; fi
